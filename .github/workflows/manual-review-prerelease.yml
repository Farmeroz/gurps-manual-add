name: Publish manual review prerelease

on:
  push:
    branches:
      - fix/manual-area-review

permissions:
  contents: read

concurrency:
  group: manual-review-prerelease
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prerelease:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foundry-package
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node -p 'require("./dist/module.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]
          release_tag="v$version"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; nothing to publish."
            exit 0
          fi
          cat > release-notes.txt <<'NOTES'
          Fixes Attack area selection for actors without a hit-location table. Single-location, large-area and explosion modes remain available and survive rerendering. Reviewed DR is still required; no anatomy or armour average is inferred.

          Includes regression tests using GGA's calculator and browser controls. Install this candidate for live testing; stable 0.3.2 remains unchanged.
          NOTES
          gh release create "$release_tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Manual Apply Damage $version" \
            --notes-file release-notes.txt \
            --prerelease --latest=false
